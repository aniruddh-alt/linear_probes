run_name: detecting_high_stakes
action: pipeline
seed: 42

dataset:
  path: Arrrlex/models-under-pressure
  config: training
  split: train
  text_key: inputs
  label_key: labels
  id_key: ids
  label_map:
    high-stakes: 1
    low-stakes: 0
  max_samples: 1000
  ood_configs:
    - anthropic_hh_balanced
    - mt_balanced
    - toolace_balanced
    - mental_health_balanced
    - aya_redteaming_balanced
  ood_split: test

model:
  model_name: meta-llama/Llama-3.1-8B
  dtype: bfloat16

extraction:
  batch_size: 1
  token_index: null  # full sequence

layers: [10, 13, 15, 17, 20]

probe:
  epochs: 20
  learning_rate: 0.001
  weight_decay: 0.1
  bootstrap_samples: 200
  early_stopping_patience: 5
  probe_type: attention
  probe_kwargs:
    n_heads: 4

split:
  train_fraction: 0.7
  val_fraction: 0.15
  test_fraction: 0.15

sweep:
  batch_size: 128
  selection_metric: auroc

io:
  output_dir: experiments/detecting_high_stakes/data
