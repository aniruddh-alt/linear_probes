apiVersion: apps/v1
kind: Deployment
metadata:
  name: ani-rjudge-dissoc
  namespace: oumi-science
spec:
  selector:
    matchLabels:
      name: ani-rjudge-dissoc
  template:
    metadata:
      labels:
        name: ani-rjudge-dissoc
    spec:
      nodeSelector:
        kubernetes.io/hostname: worker-gpu-8x-h100-sxm5gdr-zjdfj-5pk5t
      initContainers:
        - name: fix-permissions
          image: busybox
          command:
            ["sh", "-c", "mkdir -p /data/ani && chown -R 999:999 /data/ani"]
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: data
              mountPath: /data
      containers:
        - name: probe
          image: ghcr.io/oumi-ai/oumi:latest
          securityContext:
            runAsUser: 0
          command: ["sleep", "infinity"]
          resources:
            requests:
              nvidia.com/gpu: 1
              ephemeral-storage: "40Gi"
            limits:
              nvidia.com/gpu: 1
              ephemeral-storage: "80Gi"
          volumeMounts:
            - name: data
              mountPath: /data
          env:
            - name: HF_HOME
              value: /data/ani/hf_cache
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: pvc-oumi-science
      tolerations:
        - key: "nvidia.com/gpu"
          value: "true"
          operator: "Equal"
          effect: "NoSchedule"
