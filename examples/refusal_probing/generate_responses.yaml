# Step 2: Generate target model responses using the probing toolkit.
#
# This runs the toolkit's ResponseGenerator against prompts from step 1.
#
# Usage (via toolkit runner):
#   python -m cli.main examples/refusal_probing/generate_responses.yaml
#
# Input:  examples/refusal_probing/data/prompts.jsonl (from step 1)
# Output: examples/refusal_probing/data/responses.jsonl

run_name: refusal_generate_responses
seed: 42
action: generate

model:
  model_name: meta-llama/Llama-3.1-8B-Instruct
  dtype: bfloat16

generation:
  max_new_tokens: 256
  temperature: 1.0
  do_sample: false
  batch_size: 32

io:
  input_path: examples/refusal_probing/data/prompts.jsonl
  output_dir: examples/refusal_probing/data
