[project]
name = "linear-probes"
version = "0.1.0"
description = "Mechanistic interpretability toolkit for activation extraction and probing."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "datasets>=3.0.0",
    "nnterp>=1.2.2",
    "safetensors",
    "torch",
    "typing_extensions",
    "torchmetrics",
    "matplotlib>=3.10.8",
    "omegaconf>=2.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["activation*", "cli*", "configs*", "core*", "dataset*", "probes*", "runners*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
