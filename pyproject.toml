[project]
name = "sonde"
version = "0.1.0"
description = "A slender probe for the hidden layers of large models — a mech interp toolkit for activation extraction and linear probing."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "datasets>=3.0.0",
    "nnterp>=1.2.2",
    "transformers>=4.40.0",
    "safetensors",
    "einops",
    "torch",
    "typing_extensions",
    "torchmetrics",
    "omegaconf>=2.3.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
viz = [
    "matplotlib>=3.10.8",
]
dev = [
    "pytest",
    "pyright",
    "ruff",
    "matplotlib>=3.10.8",
]

[project.scripts]
sonde = "sonde.cli.main:entrypoint"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["sonde*"]

[tool.setuptools.package-data]
"sonde" = ["py.typed"]
"sonde.configs" = ["*.yaml", "recipes/*.yaml", "recipes/data/*.safetensors", "recipes/data/*.json"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 88
exclude = [".claude/worktrees"]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "SIM",   # flake8-simplify
    "RUF",   # ruff-specific rules
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "E741",   # ambiguous variable name (common in math-heavy code)
    "RUF012", # mutable class default (dataclass-like patterns)
]

[tool.ruff.lint.isort]
known-first-party = ["sonde"]

[tool.pyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.10"
typeCheckingMode = "basic"
reportPrivateImportUsage = "none"
