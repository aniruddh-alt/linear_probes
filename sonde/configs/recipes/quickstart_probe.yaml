# Quickstart: layer-wise probe sweep on a bundled synthetic extraction.
#
# Runs end-to-end with no model download and no GPU:
#
#     sonde run quickstart
#
# It trains a linear probe at each layer of a small bundled activation set,
# selects the best layer on validation, reports test metrics + controls, and
# writes a probe artifact (the concept direction) to the output directory.
# Point `io.input_path` at your own extraction manifest to probe real data.
run_name: quickstart_probe
seed: 0
action: probe_sweep

probe:
  epochs: 50
  learning_rate: 0.05
  weight_decay: 0.01
  threshold: 0.5
  early_stopping_patience: 10
  bootstrap_samples: 0

split:
  train_fraction: 0.7
  val_fraction: 0.15
  test_fraction: 0.15
  split_seed: 0

sweep:
  activation_targets: ["layers_output:0", "layers_output:1"]
  batch_size: 32
  selection_metric: auroc
  maximize_metric: true
  control_seeds: [0, 1, 2]
  enforce_control_sanity: true

io:
  # Bundled with the package; resolves to an absolute path at load time.
  input_path: ${sonde_pkg:recipes/data/quickstart_extraction_manifest.json}
  output_dir: artifacts/quickstart

output:
  output_dir: artifacts/quickstart
  save_plots: false
