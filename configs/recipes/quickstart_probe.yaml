# Quickstart: refusal probe sweep
run_name: quickstart_probe
seed: 0
action: probe_sweep

probe:
  epochs: 20
  learning_rate: 0.01
  weight_decay: 0.01
  threshold: 0.5
  early_stopping_patience: 5
  bootstrap_samples: 0

split:
  train_fraction: 0.7
  val_fraction: 0.15
  test_fraction: 0.15
  split_seed: 0

sweep:
  batch_size: 32
  selection_metric: auroc
  maximize_metric: true
  enforce_control_sanity: true

output:
  output_dir: artifacts
  save_plots: true
