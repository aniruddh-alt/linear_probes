<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" role="img" aria-label="A probe descending through transformer layers">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b1020"/>
      <stop offset="100%" stop-color="#131a33"/>
    </linearGradient>
    <linearGradient id="layer" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1f2a4a" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#2a3a6d" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#1f2a4a" stop-opacity="0.25"/>
    </linearGradient>
    <linearGradient id="probe" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffd866"/>
      <stop offset="100%" stop-color="#ff7755"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#ffd866" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ffd866" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="300" fill="url(#bg)"/>

  <!-- transformer layer stack -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#8aa0cc">
    <rect x="80"  y="40"  width="640" height="24" rx="4" fill="url(#layer)"/>
    <text x="90"  y="56">layer 31</text>

    <rect x="80"  y="72"  width="640" height="24" rx="4" fill="url(#layer)"/>
    <text x="90"  y="88">layer 24</text>

    <rect x="80"  y="104" width="640" height="24" rx="4" fill="url(#layer)"/>
    <text x="90"  y="120">layer 18</text>

    <rect x="80"  y="136" width="640" height="24" rx="4" fill="url(#layer)"/>
    <text x="90"  y="152">layer 11</text>

    <rect x="80"  y="168" width="640" height="24" rx="4" fill="url(#layer)"/>
    <text x="90"  y="184">layer  6</text>

    <rect x="80"  y="200" width="640" height="24" rx="4" fill="url(#layer)"/>
    <text x="90"  y="216">layer  2</text>

    <rect x="80"  y="232" width="640" height="24" rx="4" fill="url(#layer)"/>
    <text x="90"  y="248">embed</text>
  </g>

  <!-- the probe descending -->
  <line x1="500" y1="30"  x2="500" y2="270" stroke="url(#probe)" stroke-width="2" stroke-dasharray="2 4"/>
  <circle cx="500" cy="148" r="18" fill="url(#glow)"/>
  <circle cx="500" cy="148" r="5"  fill="#ffd866"/>
  <polygon points="496,154 504,154 500,168" fill="#ff7755"/>

  <!-- concept direction arrow -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#ffd866">
    <text x="520" y="145">concept direction</text>
    <text x="520" y="160" fill="#8aa0cc">layer 11 · auroc 0.946</text>
  </g>

  <!-- title -->
  <g font-family="ui-serif, Georgia, serif">
    <text x="80" y="24" font-size="14" fill="#8aa0cc" font-style="italic">a sonde, dropped through a transformer</text>
  </g>
</svg>
